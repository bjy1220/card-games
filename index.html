<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>백지윤의 카드게임 모음</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #f5efe0 0%, #ece0c8 40%, #ddc9a3 100%);
    color: #5a4a35;
    min-height: 100vh;
    padding: 40px 20px;
    text-align: center;
  }
  h1 { font-size: 32px; color: #8a6d3b; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(255,255,255,0.6); }
  .sub { font-size: 15px; color: #a0825a; margin-bottom: 36px; }
  .games {
    display: flex;
    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
    max-width: 980px;
    margin: 0 auto;
  }
  .card-link {
    display: block;
    width: 260px;
    background: rgba(255,251,240,0.8);
    border: 2px solid #c9a86a;
    border-radius: 20px;
    padding: 28px 20px;
    text-decoration: none;
    color: #5a4a35;
    box-shadow: 0 8px 20px rgba(138,109,59,0.25);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .card-link:hover {
    transform: translateY(-6px);
    box-shadow: 0 14px 28px rgba(138,109,59,0.35);
  }
  .card-link .emoji { font-size: 56px; margin-bottom: 12px; }
  .card-link .title { font-size: 22px; font-weight: bold; color: #8a6d3b; margin-bottom: 6px; }
  .card-link .desc { font-size: 13px; color: #8a7a5a; line-height: 1.5; }
  footer { margin-top: 40px; font-size: 12px; color: #b08d4e; }
</style>
</head>
<body>
<h1>🃏 백지윤의 카드게임 모음</h1>
<div class="sub">카드를 클릭해서 게임을 즐겨보세요!</div>
<div class="games">
  <a class="card-link" href="uno.html">
    <div class="emoji">🎨</div>
    <div class="title">우노 UNO</div>
    <div class="desc">핑크 카드로 즐기는 우노! AI 3명과 대결</div>
  </a>
  <a class="card-link" href="halligalli.html">
    <div class="emoji">🔔</div>
    <div class="title">할리갈리</div>
    <div class="desc">같은 과일이 5개면 벨을 울려세요!</div>
  </a>
</div>
<footer>made with ♥ · GitHub Pages</footer>
</body>
</html>
