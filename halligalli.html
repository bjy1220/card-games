<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>할리갈리 Halli Galli</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 25%, #fbc2eb 55%, #a18cd1 100%);
    color: #4a3a5a;
    min-height: 100vh;
    padding: 12px;
    user-select: none;
    text-align: center;
  }
  h1 { font-size: 26px; margin-bottom: 4px; color: #6a4c93; text-shadow: 0 2px 4px rgba(255,255,255,0.6); }
  #info { font-size: 13px; color: #6a4c93; margin-bottom: 8px; }
  #msg { min-height: 26px; font-weight: bold; color: #c2185b; font-size: 16px; margin-bottom: 8px; }

  #wrap {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    justify-content: center;
    max-width: 920px;
    margin: 0 auto 12px;
  }
  #table {
    position: relative;
    flex: 1;
    max-width: 760px;
    height: 500px;
    background: radial-gradient(ellipse at center, #f5ecd9 0%, #e8d9b8 60%, #d4bf95 100%);
    border: 4px solid #b89b6a;
    border-radius: 24px;
    box-shadow: inset 0 0 36px rgba(255,255,255,0.4), 0 8px 24px rgba(106,76,147,0.25);
  }
  #scoreboard {
    flex: 0 0 150px;
    background: rgba(255,255,255,0.55);
    border: 2px solid #c9a86a;
    border-radius: 18px;
    padding: 16px 12px;
    box-shadow: 0 6px 16px rgba(106,76,147,0.2);
    text-align: center;
  }
  #scoreboard h2 { font-size: 15px; color: #6a4c93; margin-bottom: 12px; }
  .score-row { display: flex; justify-content: space-around; margin-bottom: 12px; }
  .score-box {
    background: #fff;
    border-radius: 12px;
    padding: 10px 8px;
    width: 56px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .score-box .label { font-size: 12px; color: #8e7cc3; font-weight: bold; margin-bottom: 2px; }
  .score-box .val { font-size: 26px; font-weight: bold; }
  .score-box.win .val { color: #ec407a; }
  .score-box.lose .val { color: #8e7cc3; }
  #btnResetScore {
    background: #c9a86a; color: #fff; border: none; padding: 6px 12px;
    border-radius: 12px; font-size: 12px; cursor: pointer; font-weight: bold;
  }
  #btnResetScore:hover { background: #b88a4a; }

  .player {
    position: absolute;
    width: 160px;
    text-align: center;
  }
  .player .name { font-weight: bold; font-size: 14px; margin-bottom: 3px; color: #4a3a5a; }
  .player .name.turn { color: #d81b60; text-shadow: 0 0 8px #ffd6e7; }
  .player .name.out { color: #b0a0b8; text-decoration: line-through; }
  .player .count { font-size: 12px; color: #6a4c93; margin-bottom: 5px; }
  .player.me { bottom: 10px; left: 50%; transform: translateX(-50%); }
  .player.ai-top { top: 10px; left: 50%; transform: translateX(-50%); }
  .player.ai-left { top: 50%; left: 10px; transform: translateY(-50%); }
  .player.ai-right { top: 50%; right: 10px; transform: translateY(-50%); }

  .card {
    width: 78px;
    height: 108px;
    border-radius: 8px;
    background: #fff;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 6px rgba(0,0,0,0.5);
    border: 2px solid #ccc;
    position: relative;
    overflow: hidden;
  }
  .card .fruits {
    font-size: 19px;
    line-height: 1.15;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    width: 66px;
    gap: 1px;
  }
  .card .num {
    position: absolute; top: 3px; left: 6px;
    font-size: 13px; font-weight: bold; color: #333;
    background: rgba(255,255,255,0.8); border-radius: 4px; padding: 0 4px;
  }
  .card.deck {
    background: repeating-linear-gradient(45deg, #f48fb1, #f48fb1 8px, #ec407a 8px, #ec407a 16px);
    border-color: #c2185b;
  }
  .card.deck::after { content: '🌸'; color: rgba(255,255,255,0.6); font-size: 36px; }
  .card.empty { background: rgba(255,255,255,0.35); border: 2px dashed #8e7cc3; box-shadow: none; }
  .card.empty::after { content: '없음'; color: #8e7cc3; font-size: 12px; }

  .bg-strawberry { background: linear-gradient(135deg, #ffeef0, #ffd6dd); }
  .bg-banana { background: linear-gradient(135deg, #fffbe6, #fff0a8); }
  .bg-lime { background: linear-gradient(135deg, #f0fbe6, #d6f5a8); }
  .bg-plum { background: linear-gradient(135deg, #f6ecff, #e0c6f5); }

  #bell {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 6px solid #fff;
    background: radial-gradient(circle at 35% 30%, #ffe082, #ff9a3c 70%, #f06292 100%);
    font-size: 50px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(240,98,146,0.5);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.08s;
  }
  #bell:active { transform: translate(-50%, -50%) scale(0.92); }
  #bell.armed {
    animation: pulse 0.6s infinite;
    border-color: #fff;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 18px #ff5252, 0 6px 14px rgba(0,0,0,0.3); }
    50%     { box-shadow: 0 0 42px #ff5252, 0 0 60px #ffd6e7, 0 6px 14px rgba(0,0,0,0.3); }
  }

  #controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
  button {
    background: #8e7cc3; color: #fff; border: none;
    padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px;
    box-shadow: 0 4px 10px rgba(142,124,195,0.4);
    transition: transform 0.1s, background 0.2s;
  }
  button:hover { background: #a391d8; transform: translateY(-1px); }
  button:disabled { background: #c9bcd9; color: #f0eaf5; cursor: not-allowed; box-shadow: none; transform: none; }
  button#btnBell { background: linear-gradient(135deg, #f06292, #ec407a); color: #fff; font-size: 16px; padding: 12px 26px; box-shadow: 0 4px 12px rgba(236,64,122,0.5); }
  button#btnBell:hover { background: linear-gradient(135deg, #ff7aa2, #f06292); }
  button#btnBell:disabled { background: #e0c9d6; color: #f5f0f3; box-shadow: none; }

  .legend { font-size: 12px; color: #6a4c93; margin-top: 4px; line-height: 1.5; }
  .legend b { color: #c2185b; }
</style>
</head>
<body>
<h1>🔔 할리갈리 Halli Galli</h1>
<div id="info">같은 과일이 <b>정확히 5개</b> 보이면 벨을 울리세요! (벨: 클릭 / 스페이스바, 뒤집기: F키)</div>
<div id="msg"></div>

<div id="wrap">
  <div id="table">
    <div class="player ai-top" id="p2"><div class="name">AI 2</div><div class="count">카드: 0</div><div class="card deck"></div></div>
    <div class="player ai-left" id="p1"><div class="name">AI 1</div><div class="count">카드: 0</div><div class="card deck"></div></div>
    <div class="player ai-right" id="p3"><div class="name">AI 3</div><div class="count">카드: 0</div><div class="card deck"></div></div>
    <div class="player me" id="p0"><div class="name">나</div><div class="count">카드: 0</div><div class="card deck"></div></div>
    <div id="bell">🔔</div>
  </div>
  <div id="scoreboard">
    <h2>📊 전적</h2>
    <div class="score-row">
      <div class="score-box win"><div class="label">승</div><div class="val" id="winCnt">0</div></div>
      <div class="score-box lose"><div class="label">패</div><div class="val" id="loseCnt">0</div></div>
    </div>
    <button id="btnResetScore">전적 초기화</button>
  </div>
</div>

<div id="controls">
  <button id="btnFlip">카드 뒤집기 (F)</button>
  <button id="btnBell">벨 울리기 (Space)</button>
  <button id="btnNew">새 게임</button>
</div>
<div class="legend">
  과일: 🍓딸기 🍌바나나 🍋라임 🫐자두 &nbsp;|&nbsp;
  <b>올바른 벨</b>: 탁자의 모든 카드를 가져옵니다 &nbsp;|&nbsp;
  <b>잘못된 벨</b>: 다른 플레이어에게 1장씩 줍니다
</div>

<script>
// ====== 게임 상태 ======
const FRUITS = ['strawberry','banana','lime','plum'];
const FRUIT_EMOJI = {strawberry:'🍓', banana:'🍌', lime:'🍋', plum:'🫐'};
const FRUIT_NAME  = {strawberry:'딸기', banana:'바나나', lime:'라임', plum:'자두'};
const FRUIT_BG    = {strawberry:'bg-strawberry', banana:'bg-banana', lime:'bg-lime', plum:'bg-plum'};

let players = [];        // {name, deck[], pile[], isMe, eliminated}
let turnIdx = 0;         // 현재 뒤집을 차례
let ringOpen = false;    // 5개 달성하여 벨 대기 중
let validFruit = null;   // 현재 5개인 과일
let aiRingTimeouts = [];
let lastResolveAt = 0;   // 벨 해결 직후(중복 클릭 방지용)
let gameOver = false;

// ====== 덱 구성 ======
// 과일당 14장 (1×3, 2×3, 3×3, 4×3, 5×2) -> 총 56장
function buildDeck(){
  const deck=[];
  const counts = {1:3, 2:3, 3:3, 4:3, 5:2};
  for(const f of FRUITS){
    for(const n in counts){
      for(let i=0;i<counts[n];i++) deck.push({fruit:f, count:Number(n)});
    }
  }
  shuffle(deck);
  return deck;
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}

// ====== 초기화 ======
function newGame(){
  clearAiRings();
  const deck = buildDeck();
  players = [
    {name:'나',    deck:[], pile:[], isMe:true,  eliminated:false},
    {name:'AI 1',  deck:[], pile:[], isMe:false, eliminated:false},
    {name:'AI 2',  deck:[], pile:[], isMe:false, eliminated:false},
    {name:'AI 3',  deck:[], pile:[], isMe:false, eliminated:false},
  ];
  for(let i=0;i<deck.length;i++) players[i%4].deck.push(deck[i]);
  turnIdx=0; ringOpen=false; validFruit=null; gameOver=false; lastResolveAt=0;
  updateScoreUI();
  setMsg('새 게임 시작! 같은 과일이 정확히 5개면 벨을 울리세요.');
  render();
  if(!players[turnIdx].isMe) scheduleAiFlip();
}

// ====== 계산 ======
function topCards(){ return players.map(p=> p.pile.length>0 ? p.pile[p.pile.length-1] : null); }
function fruitSums(){
  const sums={strawberry:0,banana:0,lime:0,plum:0};
  for(const c of topCards()){ if(c) sums[c.fruit]+=c.count; }
  return sums;
}
function findFive(){
  const sums=fruitSums();
  for(const f of FRUITS){ if(sums[f]===5) return f; }
  return null;
}

// ====== 카드 뒤집기 ======
function flipCard(pi){
  if(gameOver || ringOpen) return;
  const p=players[pi];
  if(p.eliminated) return;
  if(p.deck.length===0){
    p.eliminated=true;
    setMsg(p.name+'이(가) 카드가 없어 탈락했습니다!');
    render();
    if(checkEnd()) return;
    nextTurn();
    return;
  }
  const card = p.deck.pop();
  p.pile.push(card);
  setMsg(p.name + (p.isMe?'이(가)':'이(가)') + ' 카드를 뒤집었습니다: ' + FRUIT_EMOJI[card.fruit] + ' ' + FRUIT_NAME[card.fruit] + ' ×' + card.count);
  render();

  const f = findFive();
  if(f){
    openRing(f);
  } else {
    closeRing();
    nextTurn();
  }
}

// ====== 벨(링) 처리 ======
function openRing(fruit){
  ringOpen=true; validFruit=fruit;
  const bell=document.getElementById('bell');
  bell.classList.add('armed');
  setMsg('⚡ ' + FRUIT_NAME[fruit] + '이(가) 정확히 5개! 벨을 울리세요!');
  clearAiRings();
  // AI 들의 반응 시간 스케줄 (사람이 직접 누름)
  for(let i=0;i<players.length;i++){
    if(players[i].isMe || players[i].eliminated) continue;
    const delay = 420 + Math.random()*950;  // 420~1370ms
    const idx=i;
    const t=setTimeout(()=>{
      if(ringOpen && validFruit===fruit){
        ringOpen=false;
        bell.classList.remove('armed');
        resolveRing(idx, true);
      }
    }, delay);
    aiRingTimeouts.push(t);
  }
}
function closeRing(){
  ringOpen=false; validFruit=null;
  document.getElementById('bell').classList.remove('armed');
}
function clearAiRings(){ aiRingTimeouts.forEach(t=>clearTimeout(t)); aiRingTimeouts=[]; }

function humanRing(){
  if(gameOver) return;
  if(Date.now()-lastResolveAt < 400) return; // 직전 해결 직후 클릭 무시(경합 판정 보정)
  if(players[0].eliminated) return;
  if(ringOpen){
    ringOpen=false;
    document.getElementById('bell').classList.remove('armed');
    resolveRing(0, true);
  } else {
    resolveRing(0, false);
  }
}

function resolveRing(winnerIdx, correct){
  clearAiRings();
  document.getElementById('bell').classList.remove('armed');
  lastResolveAt = Date.now();

  if(correct){
    const winner=players[winnerIdx];
    let won=[];
    for(const p of players){ won = won.concat(p.pile); p.pile=[]; }
    shuffle(won);
    winner.deck = won.concat(winner.deck);  // 가져온 카드를 아래로
    setMsg('🔔 ' + winner.name + '이(가) 벨을 울려 ' + won.length + '장을 가져갔습니다!');
    turnIdx = winnerIdx;
    render();
    if(checkEnd()) return;
    setTimeout(()=>{ if(!gameOver && !players[turnIdx].isMe) scheduleAiFlip(); }, 950);
  } else {
    const loser=players[winnerIdx];
    let penalty=0;
    for(const p of players){
      if(p===loser || p.eliminated) continue;
      if(loser.deck.length>0){
        const c=loser.deck.shift();
        p.deck.push(c);
        penalty++;
      }
    }
    setMsg('❌ ' + loser.name + '이(가) 잘못된 벨! 페널티로 ' + penalty + '장을 나눠줍니다.');
    render();
    if(checkEnd()) return;
    // 턴은 그대로 진행(벨이 잘못 울려도 흐름 유지)
    if(!ringOpen && !players[turnIdx].isMe && !gameOver) scheduleAiFlip();
  }
}

// ====== 턴 관리 ======
function nextTurn(){
  if(gameOver) return;
  for(let i=0;i<4;i++){
    turnIdx=(turnIdx+1)%4;
    if(!players[turnIdx].eliminated) break;
  }
  render();
  if(players[turnIdx].isMe){
    setMsg('내 턴! 카드를 뒤집으세요. (F키 또는 버튼)');
  } else {
    scheduleAiFlip();
  }
}
function scheduleAiFlip(){
  if(gameOver || ringOpen) return;
  if(players[turnIdx].isMe || players[turnIdx].eliminated) return;
  setTimeout(()=>{
    if(gameOver || ringOpen) return;
    if(players[turnIdx].isMe || players[turnIdx].eliminated) return;
    flipCard(turnIdx);
  }, 700 + Math.random()*500);
}

// ====== 종료 검사 ======
let winCnt = Number(localStorage.getItem('hg_win')||0);
let loseCnt = Number(localStorage.getItem('hg_lose')||0);
function updateScoreUI(){
  document.getElementById('winCnt').textContent = winCnt;
  document.getElementById('loseCnt').textContent = loseCnt;
}
function addResult(win){
  if(win){ winCnt++; localStorage.setItem('hg_win', winCnt); }
  else   { loseCnt++; localStorage.setItem('hg_lose', loseCnt); }
  updateScoreUI();
}
function checkEnd(){
  if(players[0].eliminated){
    gameOver=true;
    setMsg('😔 당신은 탈락했습니다. 게임 오버!');
    addResult(false);
    render();
    return true;
  }
  const alive = players.filter(p=>!p.eliminated);
  if(alive.length<=1){
    gameOver=true;
    if(alive.length===1 && alive[0].isMe){ setMsg('🎉 승리! 마지막까지 살아남았습니다!'); addResult(true); }
    else { setMsg('게임 종료!'); }
    render();
    return true;
  }
  return false;
}

// ====== 렌더링 ======
function setMsg(m){ document.getElementById('msg').textContent=m; }

function render(){
  for(let i=0;i<4;i++){
    const p=players[i];
    const el=document.getElementById('p'+i);
    const nameEl=el.querySelector('.name');
    nameEl.textContent = p.name;
    nameEl.classList.toggle('turn', i===turnIdx && !p.eliminated && !gameOver);
    nameEl.classList.toggle('out', p.eliminated);
    el.querySelector('.count').textContent = '카드: ' + p.deck.length + (p.eliminated?' (탈락)':'');
    const cardEl=el.querySelector('.card');
    if(p.pile.length>0){
      const c=p.pile[p.pile.length-1];
      cardEl.className='card ' + FRUIT_BG[c.fruit];
      cardEl.innerHTML='<span class="num">' + c.count + '</span><span class="fruits">' + FRUIT_EMOJI[c.fruit].repeat(c.count) + '</span>';
    } else if(p.deck.length>0){
      cardEl.className='card deck';
      cardEl.innerHTML='';
    } else {
      cardEl.className='card empty';
      cardEl.innerHTML='';
    }
  }
  document.getElementById('btnFlip').disabled = !(turnIdx===0 && !players[0].eliminated && !gameOver && !ringOpen);
  document.getElementById('btnBell').disabled = gameOver || players[0].eliminated;
}

// ====== 이벤트 ======
document.getElementById('btnFlip').addEventListener('click', ()=>{ if(turnIdx===0 && !ringOpen) flipCard(0); });
document.getElementById('btnBell').addEventListener('click', humanRing);
document.getElementById('btnNew').addEventListener('click', newGame);
document.getElementById('btnResetScore').addEventListener('click', ()=>{
  winCnt=0; loseCnt=0;
  localStorage.removeItem('hg_win'); localStorage.removeItem('hg_lose');
  updateScoreUI();
});
document.getElementById('bell').addEventListener('click', humanRing);
document.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); humanRing(); }
  else if(e.code==='KeyF'){ if(turnIdx===0 && !ringOpen) flipCard(0); }
  else if(e.code==='KeyN'){ newGame(); }
});

newGame();
</script>
</body>
</html>
